[package]
name = "mykv"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.11.8"
prost = "0.14.1"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive","alloc"] }
serde_json = "1.0.145"
tokio = { version = "1", features = ["full"] }
tonic = "0.14.2"
tonic-build = "0.14.2"
tonic-prost = "0.14.2"
tonic-prost-build = "*"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[build-dependencies]
prost-build = "0.14.1"
tonic-prost-build = "*"
